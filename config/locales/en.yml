  info:
    about:
      title: About us
      body: |-
        We are an online store for washing machines. We help you choose appliances for your home and offer fair prices, fast delivery and after-sales support.

        Our range includes over a hundred models from leading brands.
    contacts:
      title: Contacts
      body: |-
        Phone: 0-800-000-000 (free across Ukraine).

        Email: info@example.com.

        Opening hours: daily from 08:00 to 21:00.
    delivery:
      title: Delivery
      body: |-
        We deliver across Ukraine by Nova Poshta, courier and to pickup points.

        Delivery takes 1–3 days. Orders over 10,000 UAH ship free.

        The courier calls you before delivery and helps carry the appliance into your home.
    payment:
      title: Payment
      body: |-
        You can pay online by card, by cash or card on delivery, or by bank transfer for companies.

        0% installments up to 12 months are available for most models.
    warranty:
      title: Warranty
      body: |-
        All appliances are certified and come with an official 12-month manufacturer warranty.

        If something goes wrong, contact us and we will arrange diagnostics or a replacement.
    returns:
      title: Returns and exchange
      body: |-
        You can return or exchange an item within 14 days of purchase in accordance with the law.

        The item must keep its appearance, accessories and packaging.
    trade_in:
      title: Trade-In
      body: |-
        Hand in your old washing machine and get a discount on a new one.

        The discount depends on the condition and age of the old appliance. The courier will assess it on delivery.
