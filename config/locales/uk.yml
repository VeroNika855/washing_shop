  info:
    about:
      title: Про компанію
      body: |-
        Ми — інтернет-магазин пральних машин. Допомагаємо обрати техніку для дому, пропонуємо чесні ціни, швидку доставку та підтримку після покупки.

        В асортименті понад сотня моделей провідних брендів.
    contacts:
      title: Контакти
      body: |-
        Телефон: 0-800-000-000 (безкоштовно по Україні).

        Електронна пошта: info@example.com.

        Графік роботи: щодня з 08:00 до 21:00.
    delivery:
      title: Доставка
      body: |-
        Доставляємо по всій Україні «Новою поштою», кур'єром і в точки самовивозу.

        Термін доставки 1–3 дні. Для замовлень від 10 000 грн доставка безкоштовна.

        Кур'єр зателефонує перед доставкою та допоможе внести техніку в квартиру.
    payment:
      title: Оплата
      body: |-
        Оплатити замовлення можна карткою онлайн, під час отримання готівкою або карткою, а також безготівково для юридичних осіб.

        Доступна розстрочка 0% до 12 місяців на більшість моделей.
    warranty:
      title: Гарантія
      body: |-
        Уся техніка сертифікована та має офіційну гарантію виробника — 12 місяців.

        У разі несправності зверніться до нас, і ми організуємо діагностику або заміну.
    returns:
      title: Повернення та обмін
      body: |-
        Ви можете повернути або обміняти товар протягом 14 днів після покупки відповідно до законодавства.

        Товар має зберегти товарний вигляд, комплектацію та упаковку.
    trade_in:
      title: Trade-In
      body: |-
        Віддайте стару пральну машину й отримайте знижку на нову.

        Розмір знижки залежить від стану та віку старої техніки. Оцінку проведе кур'єр під час доставки.
