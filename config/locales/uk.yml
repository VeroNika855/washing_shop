    podarunkovi_kartky:
      title: Подарункові картки
      body:
      - Подарункова картка дозволить подарувати близьким можливість самостійно обрати техніку.
    dostavka:
      title: Доставка
      body:
      - 'Доступні способи доставки: «Нова пошта», кур''єр і самовивіз. Спосіб обирається під час оформлення замовлення.'
      - Вартість і терміни доставки уточнює менеджер після підтвердження замовлення.
      - 'Оплата: при отриманні або переказом на картку.'
    povernennia:
      title: Повернення
      body:
      - 'Якщо товар не підійшов або має недолік, зверніться до нас: звернення розглядається відповідно до чинного законодавства про захист прав споживачів.'
      - Збережіть упаковку, документи та комплектність товару. У зверненні вкажіть номер замовлення.
      - Гарантійні зобов'язання діють відповідно до гарантійного талона виробника.
    trade_in:
      title: Trade-In
      body:
      - 'Trade-In: обмін старої техніки на знижку на нову.'
    dopomoha:
      title: Допомога
      body:
      - 'Допоможемо підібрати пральну машину за характеристиками: тип завантаження, місткість, швидкість віджимання, клас енергоефективності.'
      - З питань щодо замовлення вкажіть його номер. Історію замовлень можна переглянути в особистому кабінеті.
      - 'Електронна пошта підтримки: support@washing.shop (демонстраційна адреса).'
