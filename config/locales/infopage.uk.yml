uk:
  infopage:
    home: "Головна"
    cta_title: "Потрібна порада?"
    cta_text: "Залиште номер, і ми передзвонимо та допоможемо обрати пральну машину."
    cta_call: "Замовити дзвінок"
    cta_catalog: "До каталогу"
    about:
      title: "Про компанію"
      lead: "Ми інтернет-магазин пральних машин. Допомагаємо обрати техніку для дому, пропонуємо чесні ціни, швидку доставку та підтримку після покупки."
      items:
        - title: "Понад 300 моделей"
          text: "У каталозі пральні машини провідних брендів: від компактних до місткісних, з різними типами завантаження."
        - title: "Швидка доставка"
          text: "Відправляємо замовлення в день оформлення й доставляємо по всій Україні."
        - title: "Офіційна гарантія"
          text: "Уся техніка має гарантію виробника та підтримку нашого сервісу."
        - title: "Допомога з вибором"
          text: "Підкажемо, яка модель підійде саме вам: за розміром, ціною й енергоефективністю."
    delivery:
      title: "Доставка"
      lead: "Доставляємо по всій Україні зручним для вас способом."
      items:
        - title: "Кур'єром до дверей"
          text: "Привеземо пральну машину за вказаною адресою в погоджений день."
        - title: "Нова пошта"
          text: "Отримайте замовлення у відділенні або поштоматі у своєму місті."
        - title: "Самовивіз"
          text: "Забирайте замовлення самостійно, коли вам зручно."
        - title: "Безкоштовно від 10 000 ₴"
          text: "Для замовлень від 10 000 ₴ доставка безкоштовна."
    payment:
      title: "Оплата"
      lead: "Обирайте спосіб оплати, який вам зручний."
      items:
        - title: "Карткою онлайн"
          text: "Безпечна оплата банківською карткою під час оформлення замовлення."
        - title: "Готівкою при отриманні"
          text: "Сплатіть замовлення кур'єру або у відділенні після огляду товару."
        - title: "Безпека платежів"
          text: "Ми не зберігаємо дані ваших карток."
        - title: "Чек і документи"
          text: "До кожного замовлення додаємо гарантійний талон і чек."
    warranty:
      title: "Гарантія"
      lead: "На всю техніку діє офіційна гарантія виробника."
      items:
        - title: "Гарантійний термін"
          text: "Залежно від бренду це від 12 до 24 місяців."
        - title: "Гарантійний талон"
          text: "Він додається до кожного замовлення. Збережіть його разом із чеком."
        - title: "Сервісна підтримка"
          text: "У разі несправності зв'яжіться з нами, і ми допоможемо звернутися до сервісного центру."
        - title: "Що не покривається"
          text: "Гарантія не діє на пошкодження через неправильне підключення чи експлуатацію."
    returns:
      title: "Повернення"
      lead: "Якщо товар вам не підійшов, ви можете його повернути."
      items:
        - title: "14 днів на повернення"
          text: "Протягом 14 днів з моменту отримання, відповідно до законодавства."
        - title: "Збережений вигляд"
          text: "Товар не має бути у використанні та має зберігати упаковку й комплектацію."
        - title: "Як оформити"
          text: "Зателефонуйте нам або залиште заявку на дзвінок, і ми розповімо про наступні кроки."
        - title: "Повернення коштів"
          text: "Кошти повертаємо тим самим способом, яким було здійснено оплату."
    trade-in:
      title: "Обмін старої техніки"
      lead: "Здайте стару пральну машину й отримайте знижку на нову."
      items:
        - title: "Знижка на нову машину"
          text: "Вартість старої техніки зараховується у знижку на покупку."
        - title: "Вивіз старої техніки"
          text: "Кур'єр забере стару машину під час доставки нової."
        - title: "Будь-який стан"
          text: "Приймаємо техніку різних брендів і в різному стані."
        - title: "Як взяти участь"
          text: "Залиште заявку на дзвінок, і менеджер уточнить умови для вашої моделі."
    contacts:
      title: "Контакти"
      lead: "Зв'яжіться з нами будь-яким зручним способом."
      items:
        - title: "Телефон"
          text: "0-800-000-000, безкоштовно по Україні, щодня з 8:00 до 21:00."
        - title: "Email"
          text: "info@example.com. Відповідаємо протягом робочого дня."
        - title: "Замовити дзвінок"
          text: "Натисніть кнопку нижче, і ми самі вам зателефонуємо."
        - title: "Графік роботи"
          text: "Щодня з 8:00 до 21:00, без вихідних."