en:
  infopage:
    home: "Home"
    cta_title: "Need advice?"
    cta_text: "Leave your number and we will call you back and help you choose a washing machine."
    cta_call: "Request a call"
    cta_catalog: "To catalog"
    about:
      title: "About us"
      lead: "We are an online washing machine store. We help you choose appliances for your home and offer fair prices, fast delivery and after-sales support."
      items:
        - title: "300+ models"
          text: "Washing machines from leading brands: from compact to large capacity, with different loading types."
        - title: "Fast delivery"
          text: "We ship the order on the day you place it and deliver across Ukraine."
        - title: "Official warranty"
          text: "All appliances come with a manufacturer warranty and our service support."
        - title: "Help choosing"
          text: "We will suggest the model that suits you by size, price and energy efficiency."
    delivery:
      title: "Delivery"
      lead: "We deliver across Ukraine in the way that suits you."
      items:
        - title: "Courier to your door"
          text: "We bring the washing machine to your address on the agreed day."
        - title: "Nova Poshta"
          text: "Pick up your order at a branch or parcel locker in your city."
        - title: "Self-pickup"
          text: "Collect the order yourself whenever it suits you."
        - title: "Free from 10,000 ₴"
          text: "Delivery is free for orders from 10,000 ₴."
    payment:
      title: "Payment"
      lead: "Choose the payment method that suits you."
      items:
        - title: "Card online"
          text: "Secure bank card payment when placing the order."
        - title: "Cash on delivery"
          text: "Pay the courier or the branch after inspecting the goods."
        - title: "Payment security"
          text: "We do not store your card details."
        - title: "Receipt and documents"
          text: "Every order comes with a warranty card and a receipt."
    warranty:
      title: "Warranty"
      lead: "All appliances are covered by the manufacturer's official warranty."
      items:
        - title: "Warranty period"
          text: "Depending on the brand, from 12 to 24 months."
        - title: "Warranty card"
          text: "It is included with every order. Keep it together with the receipt."
        - title: "Service support"
          text: "If something breaks, contact us and we will help you reach a service center."
        - title: "What is not covered"
          text: "The warranty does not cover damage from incorrect connection or use."
    returns:
      title: "Returns"
      lead: "If the product does not suit you, you can return it."
      items:
        - title: "14 days to return"
          text: "Within 14 days of receipt, in accordance with the law."
        - title: "Original condition"
          text: "The product must be unused and keep its packaging and accessories."
        - title: "How to return"
          text: "Call us or request a callback and we will explain the next steps."
        - title: "Refund"
          text: "We refund the money in the same way the payment was made."
    trade-in:
      title: "Trade-in"
      lead: "Hand in your old washing machine and get a discount on a new one."
      items:
        - title: "Discount on a new machine"
          text: "The value of your old appliance is counted as a discount on the purchase."
        - title: "Old appliance removal"
          text: "The courier takes your old machine when delivering the new one."
        - title: "Any condition"
          text: "We accept appliances of different brands and in different condition."
        - title: "How to take part"
          text: "Request a callback and a manager will confirm the terms for your model."
    contacts:
      title: "Contacts"
      lead: "Get in touch in any way that suits you."
      items:
        - title: "Phone"
          text: "0-800-000-000, free across Ukraine, daily 9:00 to 20:00."
        - title: "Email"
          text: "info@example.com. We reply within one business day."
        - title: "Request a call"
          text: "Press the button below and we will call you ourselves."
        - title: "Working hours"
          text: "Daily 9:00 to 20:00, no days off."